<!DOCTYPE html>
<html>
<head>
    <title>Playto Feed</title>
</head>
<body>
    <h1>Welcome to Playto Feed!</h1>
    <p>Latest posts:</p>
    <ul>
        {% for post in posts %}
        <li>
            <strong>{{ post.author.username if post.author else "Unknown" }}</strong>:
            {{ post.content }} 
            (Likes: {{ post.like_set.count }})
        </li>
        {% empty %}
        <li>No posts yet.</li>
        {% endfor %}
    </ul>
    <p>Use the API for more: <a href="/api/posts/">/api/posts/</a></p>
</body>
</html>
